name: Test invalid API key fails at deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dist directory with a sample file
        run: |
          mkdir -p dist
          echo "<html><body>Hello Neocities</body></html>" > dist/index.html

      - name: Run action with invalid API key (expect failure)
        id: action
        uses: .
        with:
          api_key: invalid-fake-api-key-12345
          dist_dir: dist
          cleanup: 'false'
          neocities_supporter: 'false'
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed due to invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key"
