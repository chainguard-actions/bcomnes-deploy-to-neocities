name: Test invalid API key fails with auth error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal dist directory with a file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          echo "<html><body>Hello Neocities</body></html>" > "$GITHUB_WORKSPACE/public/index.html"

      - name: Run action with invalid API key
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: invalid-fake-api-key-12345
          dist_dir: public
          cleanup: 'false'
          preview_before_deploy: 'false'

      - name: Assert action failed due to invalid API key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key"
