name: Test missing dist_dir causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          dist_dir: nonexistent-directory-that-does-not-exist
          cleanup: 'false'
          neocities_supporter: 'false'
          preview_before_deploy: 'false'

      - name: Assert action failed due to missing dist_dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when dist_dir does not exist, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when dist_dir does not exist"
