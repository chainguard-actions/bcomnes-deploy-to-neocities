name: Test missing dist_dir fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent dist_dir
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          dist_dir: non-existent-directory-that-does-not-exist

      - name: Assert action failed due to missing dist_dir
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when dist_dir does not exist, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when dist_dir does not exist"
