name: Test deploy with protected_files and cleanup (invalid API key - expect auth failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p protected_dist
          echo "<html><body>Protected Files Test</body></html>" > protected_dist/index.html
          echo "body { margin: 0; }" > protected_dist/reset.css

      - name: Run deploy action with protected_files and cleanup (expect failure due to invalid API key)
        id: deploy
        uses: .
        with:
          api_key: 'invalid-test-api-key-protected'
          dist_dir: 'protected_dist'
          cleanup: 'true'
          preview_before_deploy: 'false'
          protected_files: '*.css'
        continue-on-error: true

      - name: Assert action failed (not a setup error)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid API key with protected_files=*.css"
