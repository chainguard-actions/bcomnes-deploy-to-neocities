name: Test protected_files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with files
        run: |
          mkdir -p dist
          echo "<html><body>Hello</body></html>" > dist/index.html
          echo "keep me" > dist/protected.html
          echo "also keep" > dist/important.css

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          dist_dir: 'dist'
          cleanup: 'true'
          protected_files: '*.css'
          preview_before_deploy: 'false'

      - name: Assert action failed due to invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key (protected_files input was accepted)"
