name: Test protected_files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dist directory with files
        run: |
          mkdir -p dist-protected
          echo "<html><body>Hello</body></html>" > dist-protected/index.html
          echo "body { color: red; }" > dist-protected/style.css
      - id: action
        uses: .
        with:
          api_key: fake-api-key-for-testing
          dist_dir: dist-protected
          cleanup: 'false'
          preview_before_deploy: 'false'
          protected_files: '*.css'
        continue-on-error: true
      - name: Assert action ran with protected_files input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because the API key is fake, but we verify
          # it at least started (not skipped) and the protected_files input was accepted.
          # A 'failure' outcome means the action ran and attempted the deploy (expected with fake key).
          # A 'success' outcome would be unexpected in this context.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with protected_files input (outcome: $OUTCOME)"
