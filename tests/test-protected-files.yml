name: Test deploy with protected_files glob
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p site
          echo "<html><body>Protected Files Test</body></html>" > site/index.html
          echo "keep me" > site/important.txt
          echo "also keep" > site/config.json

      - id: deploy
        uses: .
        with:
          api_key: fake-api-key-for-testing
          dist_dir: site
          cleanup: 'true'
          protected_files: '*.txt'
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed (expected with fake API key)
        run: |
          echo "outcome: ${{ steps.deploy.outcome }}"
          if [ "${{ steps.deploy.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with a fake API key (protected_files test), but got: ${{ steps.deploy.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with fake API key when protected_files is set"
