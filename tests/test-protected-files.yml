name: Test protected_files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dist directory with files
        run: |
          mkdir -p dist-protected
          echo "<html><body>Hello</body></html>" > dist-protected/index.html
          echo "keep me" > dist-protected/protected.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: invalid-test-key-for-coverage
          dist_dir: dist-protected
          cleanup: 'true'
          protected_files: 'protected.html'
          preview_before_deploy: 'false'
      - name: Assert action ran (expected failure due to invalid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: $OUTCOME)"
