name: Test protected_files input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dist directory with sample files
        run: |
          mkdir -p public
          echo "<html><body>Hello Neocities</body></html>" > public/index.html
          echo "body { color: blue; }" > public/style.css
          echo "do not delete me" > public/protected.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: invalid-fake-api-key-12345
          dist_dir: public
          cleanup: 'true'
          neocities_supporter: 'false'
          preview_before_deploy: 'false'
          protected_files: 'protected.html'
      - name: Assert action failed at API level (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid API key with protected_files set"
