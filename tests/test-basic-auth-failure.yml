name: Test basic deploy - auth failure with fake key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p public
          echo "<html><body>Hello Neocities</body></html>" > public/index.html
          echo "body { color: red; }" > public/style.css

      - id: deploy
        uses: .
        with:
          api_key: fake-api-key-for-testing
          dist_dir: public
          cleanup: 'false'
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed (expected with fake API key)
        run: |
          echo "outcome: ${{ steps.deploy.outcome }}"
          if [ "${{ steps.deploy.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with a fake API key, but got outcome: ${{ steps.deploy.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with fake API key"
