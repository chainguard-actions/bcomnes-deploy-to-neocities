name: Test protected_files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with test files
        run: |
          mkdir -p public
          echo "<html><body>Hello</body></html>" > public/index.html
          echo "keep me" > public/protected.html

      - name: Run action with protected_files input (expect failure due to invalid API key)
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: 'invalid-api-key-for-testing'
          dist_dir: 'public'
          cleanup: 'true'
          protected_files: 'protected.html'
          preview_before_deploy: 'false'

      - name: Assert action failed due to invalid API key (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid API key (protected_files input was accepted)"
