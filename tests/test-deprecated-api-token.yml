name: Test deprecated api_token input still works
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          echo "<html><body>Deprecated Token Test</body></html>" > "$GITHUB_WORKSPACE/public/index.html"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: fake-api-token-deprecated
          dist_dir: public
          cleanup: 'false'
          neocities_supporter: 'false'
          preview_before_deploy: 'false'

      - name: Assert action failed at API level (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the API/network level (not at input validation)
          # because api_token is still accepted as a fallback for api_key
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake api_token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with fake deprecated api_token (input was accepted)"
