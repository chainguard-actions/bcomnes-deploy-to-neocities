name: Test deprecated api_token input still accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          echo "<html><body>Deprecated Token Test</body></html>" > "$GITHUB_WORKSPACE/public/index.html"

      - id: action
        uses: .
        with:
          api_token: fake-api-token-deprecated
          dist_dir: public
          cleanup: 'false'
          neocities_supporter: 'false'
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed at API stage (deprecated api_token input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid api_token (deprecated), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted deprecated api_token input and failed at API stage"
