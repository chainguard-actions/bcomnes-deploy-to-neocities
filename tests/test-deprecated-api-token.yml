name: Test deprecated api_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample content
        run: |
          mkdir -p dist
          echo "<html><body>Hello Neocities</body></html>" > dist/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: fake-deprecated-token
          dist_dir: dist
          cleanup: 'false'
          preview_before_deploy: 'false'

      - name: Assert action ran (failed gracefully with invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid/fake api_token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
