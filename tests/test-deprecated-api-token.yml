name: Test deprecated api_token input (backward compatibility)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p legacy-site
          echo "<html><body>Legacy Token Test</body></html>" > legacy-site/index.html

      - id: action
        uses: .
        with:
          api_token: fake-legacy-api-token-for-testing
          dist_dir: legacy-site
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed at API stage using deprecated api_token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action falls back to api_token when api_key is not set.
          # It should still reach the API call stage and fail there (not at input parsing).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid api_token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly used deprecated api_token and failed at API stage"
