name: Test deprecated api_token input still works
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dist directory with sample files
        run: |
          mkdir -p site-output
          echo "<html><body>Test page</body></html>" > site-output/index.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: ''
          api_token: deprecated-fake-token-for-testing
          dist_dir: site-output
          cleanup: 'false'
          neocities_supporter: 'false'
          preview_before_deploy: 'false'
      - name: Assert action failed at API level (not at directory or key check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid deprecated api_token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed deprecated api_token input and failed at API level"
