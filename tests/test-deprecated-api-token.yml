name: Test deprecated api_token input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dist directory with sample content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          echo "<html><body>Test deprecated token</body></html>" > "$GITHUB_WORKSPACE/public/index.html"

      - name: Run action using deprecated api_token input (expect failure at API stage, not input validation)
        id: action
        uses: .
        with:
          api_key: ''
          api_token: invalid-deprecated-token-for-testing
          dist_dir: public
          cleanup: 'false'
          neocities_supporter: 'false'
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed at API stage (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid (API rejection),
          # not because of missing/invalid inputs — proving the deprecated api_token was read.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid deprecated api_token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed deprecated api_token input (failed at API stage as expected)"
