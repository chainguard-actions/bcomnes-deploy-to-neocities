name: Test deprecated api_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dist directory with a sample file
        run: |
          mkdir -p dist-site
          echo "<html><body>Hello</body></html>" > dist-site/index.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: dummy-deprecated-token
          dist_dir: dist-site
          cleanup: 'false'
          preview_before_deploy: 'false'
      - name: Assert action ran (input accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the api_token is invalid,
          # but it should have started and accepted the deprecated api_token input.
          # A failure here means the action crashed before even trying to use the token.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with deprecated api_token input"
