name: Test deploy with cleanup enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p dist_output
          echo "<html><body>Cleanup Test</body></html>" > dist_output/index.html
          echo "p { margin: 0; }" > dist_output/main.css

      - id: deploy
        uses: .
        with:
          api_key: fake-api-key-for-testing
          dist_dir: dist_output
          cleanup: 'true'
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed (expected with fake API key)
        run: |
          echo "outcome: ${{ steps.deploy.outcome }}"
          if [ "${{ steps.deploy.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with a fake API key in cleanup mode, but got: ${{ steps.deploy.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with fake API key in cleanup mode"
