name: Test cleanup mode with supporter flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p site-output
          echo "<html><body>Cleanup Test</body></html>" > site-output/index.html
          echo "p { margin: 0; }" > site-output/main.css

      - id: action
        uses: .
        with:
          api_key: fake-api-key-for-testing
          dist_dir: site-output
          cleanup: 'true'
          neocities_supporter: 'true'
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed at API stage (not input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # cleanup=true and neocities_supporter=true are valid boolean inputs.
          # The action should parse them correctly and fail only at the API call.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly parsed cleanup/supporter inputs and failed at API stage"
