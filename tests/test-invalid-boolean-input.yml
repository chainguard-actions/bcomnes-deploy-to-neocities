name: Test invalid boolean input fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal dist directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          echo "<html><body>Test</body></html>" > "$GITHUB_WORKSPACE/public/index.html"

      - name: Run action with invalid cleanup boolean value
        id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          dist_dir: public
          cleanup: 'not-a-boolean'
          preview_before_deploy: 'false'

      - name: Assert action failed due to invalid boolean input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid boolean input, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid boolean input for cleanup"
