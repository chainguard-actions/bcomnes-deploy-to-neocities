name: Test invalid boolean input fails with assertion error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dist directory with sample content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          echo "<html><body>Test</body></html>" > "$GITHUB_WORKSPACE/public/index.html"

      - name: Run action with invalid cleanup boolean value (expect failure)
        id: action
        uses: .
        with:
          api_key: fake-key-for-validation-test
          dist_dir: public
          cleanup: 'not-a-boolean'
          neocities_supporter: 'false'
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed due to invalid boolean input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when cleanup is not a valid boolean, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid boolean input for cleanup"
