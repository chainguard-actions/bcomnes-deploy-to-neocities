name: Test deploy with preview enabled (invalid API key - expect auth failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p preview_dist
          echo "<html><body>Preview Test</body></html>" > preview_dist/index.html
          echo "h1 { color: blue; }" > preview_dist/styles.css
          echo "console.log('hello');" > preview_dist/app.js

      - name: Run deploy action with preview enabled (expect failure due to invalid API key)
        id: deploy
        uses: .
        with:
          api_key: 'invalid-test-api-key-preview'
          dist_dir: 'preview_dist'
          cleanup: 'false'
          preview_before_deploy: 'true'
        continue-on-error: true

      - name: Assert action failed (not a setup error)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid API key with preview_before_deploy=true"
