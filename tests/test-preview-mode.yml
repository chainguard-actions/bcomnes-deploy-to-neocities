name: Test preview mode with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          echo "<html><body>Preview Test</body></html>" > "$GITHUB_WORKSPACE/dist/index.html"

      - id: action
        uses: .
        with:
          api_key: fake-api-key-for-testing
          dist_dir: dist
          cleanup: 'false'
          neocities_supporter: 'false'
          preview_before_deploy: 'true'
        continue-on-error: true

      - name: Assert action failed (expected - fake API key causes auth error during preview)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key in preview mode, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key in preview mode"
