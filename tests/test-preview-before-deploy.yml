name: Test preview_before_deploy option with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dist directory with sample content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          echo "<html><body>Preview test</body></html>" > "$GITHUB_WORKSPACE/site/index.html"
          echo "body { color: red; }" > "$GITHUB_WORKSPACE/site/style.css"

      - name: Run action with preview_before_deploy enabled (expect failure at API stage)
        id: action
        uses: .
        with:
          api_key: invalid-api-key-preview-test
          dist_dir: site
          cleanup: 'false'
          neocities_supporter: 'false'
          preview_before_deploy: 'true'
        continue-on-error: true

      - name: Assert action failed (at preview or deploy API stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key during preview, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when preview_before_deploy=true with invalid API key"
