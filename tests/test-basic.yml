name: Test basic deploy (invalid API key - expect auth failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p public
          echo "<html><body>Hello Neocities</body></html>" > public/index.html
          echo "body { color: red; }" > public/style.css

      - name: Run deploy action (expect failure due to invalid API key)
        id: deploy
        uses: .
        with:
          api_key: 'invalid-test-api-key-12345'
          dist_dir: 'public'
          cleanup: 'false'
          preview_before_deploy: 'false'
        continue-on-error: true

      - name: Assert action failed (not a setup error)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid API key"
