name: Test basic usage with fake API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist directory with sample files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          echo "<html><body>Hello Neocities</body></html>" > "$GITHUB_WORKSPACE/public/index.html"
          echo "body { color: red; }" > "$GITHUB_WORKSPACE/public/style.css"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: fake-api-key-for-testing
          dist_dir: public
          cleanup: 'false'
          neocities_supporter: 'false'
          preview_before_deploy: 'false'

      - name: Assert action failed (expected - fake API key causes network/auth failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake API key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with fake API key"
